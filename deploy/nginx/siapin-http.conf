# Bootstrap HTTP untuk penerbitan sertifikat pertama. Pasang hanya satu versi:
# ganti file ini dengan siapin-https.conf setelah sertifikat berhasil terbit.
server {
    listen 80;
    server_name siapin.dikalaksana.com api-siapin.dikalaksana.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
