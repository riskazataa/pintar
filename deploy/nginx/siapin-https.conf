# Tambahkan sebagai siapin.conf; jangan mengganti konfigurasi aplikasi lain.
server {
    listen 80;
    server_name siapin.dikalaksana.com api-siapin.dikalaksana.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name siapin.dikalaksana.com;
    ssl_certificate /etc/letsencrypt/live/siapin.dikalaksana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siapin.dikalaksana.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $siapin_web http://siapin-web:80;
        proxy_pass $siapin_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api-siapin.dikalaksana.com;
    ssl_certificate /etc/letsencrypt/live/siapin.dikalaksana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siapin.dikalaksana.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $siapin_api http://siapin-api:3000;
        proxy_pass $siapin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
